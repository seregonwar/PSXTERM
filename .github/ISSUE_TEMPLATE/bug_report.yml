name: Bug report
description: Report a reproducible PSXTerm problem.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Keep reports focused on legitimate homebrew, debugging, research, and offline development workflows on consoles you own.

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which area is affected?
      options:
        - Client - psxterm
        - Workspace client - psxterm-tui / Ratatui
        - Client localization / display layout
        - Daemon - psxtermd
        - Protocol - PTTY/1
        - Shell - psh
        - TTY backend - FreeBSDPTY
        - TTY backend - PipeTTY
        - External execution - PS5
        - External execution - PS4
        - PS5 platform
        - PS4 platform
        - Host platform
        - Build / CI
        - Documentation
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Release tag, commit SHA, or branch name.
      placeholder: "v0.1.0, main@abcdef0, or local branch name"
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include host OS, compiler, console model/firmware when relevant, payload loader, and whether this is a release, payload or local build.
      placeholder: |
        Host OS:
        Compiler:
        Console model / firmware:
        Payload SDK / loader:
        TTY backend (auto / pty / pipe):
        Build type (host / PS4 payload / PS5 payload):
        Client / terminal application:
        Terminal size (columns × rows):
        Client language (en / it):
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: List the shortest reliable path that triggers the issue.
      placeholder: |
        1. Build with ...
        2. Start psxtermd ...
        3. Connect with ...
        4. Run ...
        5. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should PSXTerm have done instead?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened? Include exact errors, terminal output, protocol frames, or daemon logs when available.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs and diagnostics
      description: Paste daemon/client output, TTY probe results, CI links, or screenshots. Remove access tokens, resume tokens, and private paths.
      render: text

  - type: textarea
    id: verification
    attributes:
      label: Checks already tried
      description: Mark or describe anything you already ran.
      value: |
        - [ ] `cmake --build build-host`
        - [ ] `ctest --test-dir build-host --output-on-failure`
        - [ ] `python3 tests/integration/test_e2e.py --build build-host`
        - [ ] `psxterm-ttyprobe`
        - [ ] Reproduced on a clean checkout

  - type: checkboxes
    id: scope
    attributes:
      label: Use scope
      description: PSXTerm targets consoles you own, for homebrew, research, and offline development.
      options:
        - label: This report is not asking for online cheating, piracy, unauthorized access, or service disruption support.
          required: true
