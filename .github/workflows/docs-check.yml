name: Docs Check

on:
  pull_request:
    paths:
      - "**/*.md"
      - ".github/workflows/docs-check.yml"
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - ".github/workflows/docs-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    name: Documentation consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify relative links in Markdown
        run: |
          set -uo pipefail
          status=0
          while IFS= read -r -d '' file; do
            while IFS= read -r link; do
              case "$link" in
                ''|'#'*|http://*|https://*|mailto:*) continue ;;
              esac
              target="${link%%#*}"
              [ -z "$target" ] && continue
              dir="$(dirname "$file")"
              if [ ! -e "$dir/$target" ]; then
                echo "::error file=$file::broken relative link: $link"
                status=1
              fi
            done < <(grep -oE '\]\([^)]+\)' "$file" | sed -e 's/^](//' -e 's/)$//')
          done < <(git ls-files -z '*.md')
          exit "$status"

      - name: Ensure local development prompts are not tracked
        run: |
          set -uo pipefail
          tracked="$(git ls-files | grep -E '^PSXTerm .*Prompt.*\.md$' || true)"
          if [ -n "$tracked" ]; then
            echo "::error::Local development prompts must never be committed to this repository."
            echo "$tracked"
            exit 1
          fi
          echo "no development prompt is tracked"
