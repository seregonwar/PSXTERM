name: Verify

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tui:
    name: Ratatui client (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.120.0
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --manifest-path client/tui/Cargo.toml -- --check
      - name: Lint
        run: cargo clippy --locked --manifest-path client/tui/Cargo.toml --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --manifest-path client/tui/Cargo.toml
      - name: Release build
        run: cargo build --release --locked --manifest-path client/tui/Cargo.toml
      - name: Real terminal interaction and restoration
        if: runner.os == 'Linux'
        run: |
          cargo build --release --locked --manifest-path client/tui/Cargo.toml --example tty_decode
          python3 -m unittest discover -s client/tui/tests -p test_tty_smoke.py
          python3 client/tui/tests/tty_smoke.py --output build-tui-tty-smoke
      - name: Real host daemon interoperability
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-tui-host -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-tui-host --parallel
          ./build-tui-host/psxtermd --bind 127.0.0.1 --port 29323 --tty pipe --quiet &
          DAEMON_PID=$!
          trap 'kill "$DAEMON_PID" 2>/dev/null || true' EXIT
          python3 -c 'import socket,time; deadline=time.monotonic()+10
          while time.monotonic()<deadline:
              try:
                  s=socket.create_connection(("127.0.0.1",29323),timeout=.2); s.close(); break
              except OSError: time.sleep(.1)
          else: raise SystemExit("host daemon did not start")'
          PSXTERM_TEST_PORT=29323 cargo test --locked --manifest-path client/tui/Cargo.toml --test network actual_host -- --ignored

  host:
    name: Host build and tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure
        run: cmake -S . -B build-host -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build-host --parallel

      - name: Unit tests
        run: ctest --test-dir build-host --output-on-failure

      - name: TTY capability probe
        run: ./build-host/psxterm-ttyprobe

      - name: Integration tests
        if: runner.os == 'Linux'
        run: python3 tests/integration/test_e2e.py --build build-host

  sanitizers:
    name: Sanitizers (ASan + UBSan)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build with AddressSanitizer
        run: |
          set -euo pipefail
          cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-fsanitize=address -fno-omit-frame-pointer -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address"
          cmake --build build-asan --parallel

      - name: Run ASan tests
        run: ctest --test-dir build-asan --output-on-failure

      - name: Build with UndefinedBehaviorSanitizer
        run: |
          set -euo pipefail
          cmake -S . -B build-ubsan -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-fsanitize=undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=undefined"
          cmake --build build-ubsan --parallel

      - name: Run UBSan tests
        run: ctest --test-dir build-ubsan --output-on-failure

  payloads:
    name: Payload build (${{ matrix.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ps5
            sdk_repo: ps5-payload-dev/sdk
            sdk_asset: ps5-payload-sdk.zip
            toolchain: prospero.cmake
          - platform: ps4
            sdk_repo: ps4-payload-dev/sdk
            sdk_asset: ps4-payload-sdk.zip
            toolchain: orbis.cmake

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install LLVM 18 and packaging tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 llvm-18 llvm-18-dev wget unzip
          echo "/usr/lib/llvm-18/bin" >> "$GITHUB_PATH"

      - name: Download payload SDK
        run: |
          set -euo pipefail
          wget -q "https://github.com/${{ matrix.sdk_repo }}/releases/latest/download/${{ matrix.sdk_asset }}"
          unzip -q "${{ matrix.sdk_asset }}" -d sdk
          SDK_DIR="$(find "$PWD/sdk" -mindepth 1 -maxdepth 1 -type d | head -1)"
          test -n "$SDK_DIR"
          echo "SDK_DIR=$SDK_DIR" >> "$GITHUB_ENV"
          # The PS4 SDK linker wrapper reads this variable independently of CMake.
          echo "PS4_PAYLOAD_SDK=$SDK_DIR" >> "$GITHUB_ENV"
          echo "PS5_PAYLOAD_SDK=$SDK_DIR" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          set -euo pipefail
          cmake -S . -B build-${{ matrix.platform }} \
            -DCMAKE_TOOLCHAIN_FILE="$SDK_DIR/toolchain/${{ matrix.toolchain }}"

      - name: Build payloads
        run: |
          set -euo pipefail
          cmake --build build-${{ matrix.platform }} --parallel
          test -x build-${{ matrix.platform }}/psxtermd
          test -x build-${{ matrix.platform }}/psxterm-ttyprobe
          test -f build-${{ matrix.platform }}/cli_test.elf

      - name: Report artifacts
        run: |
          ls -la build-${{ matrix.platform }}/psxtermd \
                 build-${{ matrix.platform }}/psxterm-ttyprobe \
                 build-${{ matrix.platform }}/cli_test.elf
          file build-${{ matrix.platform }}/psxtermd
